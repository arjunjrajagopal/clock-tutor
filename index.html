<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clock Tutor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600&family=Noto+Sans+Devanagari:wght@600&display=swap">
<style>
:root{--bg:#e9eef4;--panel:#fff;--ink:#1b2533;--muted:#5d6b7e;--accent:#1f6fd6;--line:#d3dbe5;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#111821;--panel:#19222e;--ink:#e8edf3;--muted:#9aa8b9;--accent:#5aa2ff;--line:#2c3a4b;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Lexend","Noto Sans Devanagari",system-ui,sans-serif;padding:24px 16px;box-sizing:border-box}
main{display:grid;gap:14px;width:min(100%,360px);text-align:center}
h1{font-size:28px;font-weight:600;margin:0 0 8px}
a{display:block;padding:18px;border-radius:14px;background:var(--panel);border:1px solid var(--line);color:var(--accent);font-size:20px;font-weight:600;text-decoration:none}
a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
p{color:var(--muted);margin:0}
</style>
</head>
<body>
<main>
<h1>Clock Tutor</h1>
<p>Choose a language</p>
<a href="english.html">English</a>
<a href="hindi.html">हिंदी</a>
</main>
</body>
</html>
